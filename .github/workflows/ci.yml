name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host-checks:
    name: Host checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every runner label the release matrix uses appears here, including the
        # two that are otherwise release-only. Hosted images are retired on a
        # calendar rather than in response to anything in this repository, so a
        # label can stop existing without a single commit touching it -- and the
        # release is the worst place to find that out, because a tag is already
        # spent by then. macos-13 was retired exactly that way.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # openh264-sys2 builds Cisco's C++ decoder from source and assembles its
      # hot paths with NASM, which is not preinstalled on any runner image.
      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      # rustup automatically installs the pinned compiler and components from
      # rust-toolchain.toml when the first cargo command runs.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Strict Clippy must run on every target platform. A Linux-only job does
      # not observe imports that are used solely by cfg(unix) test modules.
      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run host-only tests
        run: cargo test --locked -- --test-threads=1

      - name: Build release binary
        run: cargo build --locked --release --bin droidsight

  # The npm wrapper is not exercised by the Rust suite at all, and the piece of
  # it most likely to rot is the platform list, which is written out in four
  # files that nothing links together. A tag would catch a disagreement, but by
  # then the mistake is already the reason a release is being cut twice.
  packaging:
    name: Packaging consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the platform list agrees with itself
        run: node npm/check-platform-consistency.mjs

      # release.yml checks the versions against the tag, which is the expensive
      # place to learn they disagree. This is the same check without the tag.
      - name: Verify the version and package identity agree with themselves
        run: node npm/check-version-consistency.mjs

  # `rust-version` in Cargo.toml is published to crates.io as a compatibility
  # promise, and the pinned toolchain above is far newer than it. Without this
  # job the promise is never tested, and a dependency bump or a newly stabilized
  # API would break it silently.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: msrv

      # Read the floor out of the manifest instead of repeating it here, so the
      # version that is published and the version that is tested cannot drift.
      - name: Resolve the declared minimum
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^rust-version = "\(.*\)"/\1/p' | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"

      # The minimum has to be requested by name. rust-toolchain.toml would
      # otherwise select the pinned compiler and this job would retest that pin.
      # Only a type check runs: Clippy and rustfmt output legitimately differs
      # between compiler versions, so those gates belong on the pin alone.
      - name: Check against the declared minimum
        env:
          VERSION: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          rustup toolchain install "$VERSION" --profile minimal --no-self-update
          cargo "+$VERSION" check --locked --all-targets
