name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish (without a leading v)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dispatch input is interpolated through the environment rather than
      # into the script body, so it cannot terminate the surrounding shell.
      - id: pick
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version '$version' is not a semantic version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the committed manifests would publish npm
      # packages whose version does not match the binary inside them.
      - name: Verify manifests match the release version
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          status=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 is $2, expected $VERSION" >&2
              status=1
            fi
          }
          check Cargo.toml \
            "$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1)"
          check server.json "$(node -p "require('./server.json').version")"
          check "server.json packages[0]" "$(node -p "require('./server.json').packages[0].version")"
          check npm/droidsight/package.json "$(node -p "require('./npm/droidsight/package.json').version")"

          # The MCP registry proves that whoever registers a server also controls
          # the npm package behind it, by requiring the published package to
          # carry an mcpName equal to the server.json name. It reads the package
          # already on the registry, so a mismatch cannot be corrected in place:
          # the fix has to ride a version that has not been published yet.
          # Checking it here costs nothing and fails the tag instead.
          server_name="$(node -p "require('./server.json').name")"
          package_mcp_name="$(node -p "require('./npm/droidsight/package.json').mcpName")"
          if [ "$package_mcp_name" != "$server_name" ]; then
            echo "::error::npm mcpName is $package_mcp_name, expected $server_name" >&2
            status=1
          fi

          exit $status

      # The supported platforms are enumerated in four places that nothing
      # links together. Every disagreement between them ships and fails on a
      # user's machine rather than here, so it is worth the two seconds.
      - name: Verify the platform list agrees with itself
        run: node npm/check-platform-consistency.mjs

  build:
    name: Build ${{ matrix.pkg }}
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, pkg: linux-x64, bin: droidsight }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, pkg: linux-arm64, bin: droidsight }
          # macos-15-intel, not macos-13: the macOS 13 images were retired in
          # December 2025, and macos-latest is Apple Silicon, so this is the
          # only remaining hosted label that builds an Intel binary.
          - { target: x86_64-apple-darwin, runner: macos-15-intel, pkg: darwin-x64, bin: droidsight }
          - { target: aarch64-apple-darwin, runner: macos-latest, pkg: darwin-arm64, bin: droidsight }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, pkg: win32-x64, bin: droidsight.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # openh264-sys2 assembles Cisco's decoder with NASM on every platform.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --bin droidsight --target ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Assemble npm package
        shell: bash
        run: |
          node npm/build-platform-package.mjs \
            --pkg ${{ matrix.pkg }} \
            --binary target/${{ matrix.target }}/release/${{ matrix.bin }} \
            --version ${{ needs.resolve-version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ matrix.pkg }}
          path: npm/dist/droidsight-${{ matrix.pkg }}
          if-no-files-found: error

      - name: Stage standalone archive
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} staging/
          cp LICENSE README.md staging/
          tar -czf droidsight-${{ matrix.target }}.tar.gz -C staging .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.pkg }}
          path: droidsight-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Required for npm trusted publishing, which mints a short-lived token and
      # attaches a provenance attestation instead of using a long-lived secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a newer npm than the one bundled with Node 22.
      # Without this the publish steps fail authentication, because there is
      # deliberately no long-lived NPM_TOKEN to fall back to.
      #
      # Pinned to a major rather than @latest. Every npm major so far has
      # dropped the oldest Node line it supported, and this job pins Node 22, so
      # a future npm 13 is likely to be one this runner cannot execute. Left
      # floating, that break arrives on npm's release day rather than on ours --
      # in the middle of a release, with the tag already spent. Dependabot does
      # not watch this, because it is a run step and not a manifest.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@12

      # Cheap, and deliberately ahead of everything irreversible. If the pin
      # above ever resolves to an npm that cannot mint an OIDC token, this ends
      # the run while the tag is still re-runnable, instead of after the GitHub
      # release exists and only the npm half is missing.
      - name: Verify that npm can use trusted publishing
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version on node $(node --version)"
          if [ "$(printf '11.5.1\n%s\n' "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version is too old for trusted publishing (needs >= 11.5.1)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # The npm packages carry provenance attestations, but the standalone
      # archives are unsigned and unattested. A published hash is the only
      # integrity check someone downloading a tarball directly can perform.
      - name: Record SHA-256 for the standalone archives
        run: |
          set -euo pipefail
          sha256sum artifacts/archive-*/*.tar.gz \
            | sed 's#artifacts/archive-[^/]*/##' > SHA256SUMS
          cat SHA256SUMS

      # Deliberately ahead of the npm steps. npm can fail for reasons that have
      # nothing to do with this repository — a trusted publisher not configured
      # yet, a registry outage — and when the release was created afterwards,
      # that failure spent the tag and shipped nothing at all. Attaching the
      # archives first degrades the same failure to "binaries are up, npm is
      # pending", which a re-run fixes. Re-runnable: uploads over an existing
      # release rather than failing on it.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifacts/archive-*/*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              artifacts/archive-*/*.tar.gz SHA256SUMS
          fi

      # Platform packages must exist on the registry before the wrapper that
      # lists them as optionalDependencies, or the first install resolves nothing.
      # Each is skipped when that exact version is already up, so a run that died
      # partway through the loop can be re-run without tripping EPUBLISHCONFLICT
      # on the ones that already succeeded.
      - name: Publish platform packages
        run: |
          set -euo pipefail
          for dir in artifacts/npm-*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            npm publish --access public --provenance "$dir"
          done

      - name: Publish launcher
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const path = 'npm/droidsight/package.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const version = process.env.VERSION;
            manifest.version = version;
            for (const key of Object.keys(manifest.optionalDependencies)) {
              manifest.optionalDependencies[key] = version;
            }
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          "
          cp README.md LICENSE npm/droidsight/
          name=$(node -p "require('./npm/droidsight/package.json').name")
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already published, skipping"
          else
            npm publish --access public --provenance npm/droidsight
          fi
